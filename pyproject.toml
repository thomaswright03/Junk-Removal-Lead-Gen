[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "leadgen"
version = "0.1.0"
description = "Pima County eviction and clean-out lead list for a junk-removal business"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28",
    "beautifulsoup4>=4.11",
    # Postgres (Neon) for Lead Desk online; unused when the database is a SQLite file.
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-requests",
    # Browser tests (tests/test_browser.py); also run `python -m playwright install chromium`,
    # which installs the browser build for exactly this version. Pinned so a new
    # Playwright release can't arrive without its browser.
    "playwright==1.63.0; python_version >= \"3.10\"",
]

[project.scripts]
leadgen = "leadgen.cli:main"

[tool.setuptools]
packages = ["leadgen", "leadgen.sources"]

[tool.setuptools.package-data]
leadgen = ["static/*"]

# Vercel runs Lead Desk online from this WSGI app (see docs/VERCEL.md).
[tool.vercel]
entrypoint = "leadgen.wsgi:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

# CI runs `pytest --cov` and fails below this share of lines run by the tests.
[tool.coverage.run]
source = ["leadgen"]

[tool.coverage.report]
fail_under = 82
skip_covered = true
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
# pycodestyle errors/warnings, pyflakes (unused imports and variables, undefined
# names), import order, and a few bug-prone patterns.
select = ["E", "W", "F", "I", "B"]
ignore = ["E731", "E741", "B008"]

[tool.ruff.lint.per-file-ignores]
# The exported page's HTML/CSS/JS template.
"leadgen/export.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
packages = ["leadgen"]
ignore_missing_imports = true
warn_unused_ignores = true

# Every module is fully annotated and its function bodies are checked.
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
