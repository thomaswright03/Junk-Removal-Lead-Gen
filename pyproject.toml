[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "leadgen"
version = "0.1.0"
description = "Pima County eviction and clean-out lead list for a junk-removal business"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28",
    "beautifulsoup4>=4.11",
    # Postgres (Neon) for Lead Desk online; unused when the database is a SQLite file.
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
leadgen = "leadgen.cli:main"

[tool.setuptools]
packages = ["leadgen", "leadgen.sources"]

[tool.setuptools.package-data]
leadgen = ["static/*"]

# Vercel runs Lead Desk online from this WSGI app (see docs/VERCEL.md).
[tool.vercel]
entrypoint = "leadgen.wsgi:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
