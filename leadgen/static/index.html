<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The browser's own bar (address bar on a phone) in the page's colours;
     index.html's script below keeps it matching the theme picked in Settings. -->
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1b1e" media="(prefers-color-scheme: dark)">
<title>Lead Desk</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f6feb'/%3E%3Cpath d='M7 13h18l-2 13H9z' fill='%23fff'/%3E%3Crect x='5' y='9' width='22' height='3' rx='1.5' fill='%23fff'/%3E%3Crect x='13' y='6' width='6' height='3' rx='1' fill='%23fff'/%3E%3C/svg%3E">
<script>
// The theme: the one picked in Settings (saved in this browser), else this
// computer's, following it when it changes. app.css has one dark palette,
// for data-theme="dark".
(function () {
  const dark = matchMedia("(prefers-color-scheme: dark)");
  window.applyTheme = function () {
    let t = null;
    try { t = localStorage.getItem("leaddesk.theme"); } catch (e) { /* storage blocked */ }
    const theme = t === "light" || t === "dark" ? t : dark.matches ? "dark" : "light";
    document.documentElement.dataset.theme = theme;
    // One theme colour for the browser bar, whatever the computer's setting.
    document.querySelectorAll('meta[name="theme-color"]').forEach(m => {
      m.content = theme === "dark" ? "#1b1b1e" : "#ffffff";
      if (t === "light" || t === "dark") m.removeAttribute("media");
    });
  };
  applyTheme();
  if (dark.addEventListener) dark.addEventListener("change", applyTheme); else dark.addListener(applyTheme);
})();
</script>
<link rel="stylesheet" href="static/app.css">
</head>
<body>
<header>
  <div>
    <h1>Lead Desk <span class="sub" id="purpose">· eviction and clean-out job leads</span></h1>
    <div class="sub" id="sub">Loading…</div>
    <div class="sub" id="subDetails" hidden></div>
    <div class="sub" id="jobs" role="status" aria-live="polite"></div>
  </div>
  <nav id="nav">
    <button data-tab="leads" class="on">Leads</button>
    <button data-tab="outreach">Outreach</button>
    <button data-tab="results">Results</button>
    <button data-tab="settings">Settings</button>
  </nav>
  <div class="spacer"></div>
  <!-- Opened from More tools on the Leads tab (Import a court file or saved page). -->
  <input type="file" id="importFile" accept=".html,.htm,.csv" hidden aria-label="Court file or saved court page">
  <button class="btn primary" id="refreshBtn" title="Search the court calendar for new evictions, read the case pages, look up landlords and their phones, and pull new Tucson code cases. Runs by itself every morning.">Check for new evictions</button>
</header>
<div class="banner" id="pausedBanner" hidden></div>

<main>
  <section id="tab-leads">
    <!-- Shown until the first page of leads arrives: rows the shape of leads. -->
    <div class="tablewrap" aria-hidden="true"><table class="skeleton"><tbody>
      <tr><td class="w-60"><span></span></td><td class="w-110"><span></span></td><td><span></span></td><td><span></span></td><td><span></span></td><td class="w-140"><span></span></td></tr>
      <tr><td><span></span></td><td><span></span></td><td><span></span></td><td><span></span></td><td><span></span></td><td><span></span></td></tr>
      <tr><td><span></span></td><td><span></span></td><td><span></span></td><td><span></span></td><td><span></span></td><td><span></span></td></tr>
      <tr><td><span></span></td><td><span></span></td><td><span></span></td><td><span></span></td><td><span></span></td><td><span></span></td></tr>
      <tr><td><span></span></td><td><span></span></td><td><span></span></td><td><span></span></td><td><span></span></td><td><span></span></td></tr>
    </tbody></table></div>
  </section>
  <section id="tab-outreach" hidden></section>
  <section id="tab-results" hidden></section>
  <section id="tab-settings" hidden></section>
</main>

<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dTitle"></aside>
<dialog id="confirmBox" aria-labelledby="confirmTitle">
  <form method="dialog">
    <h2 id="confirmTitle"></h2>
    <p id="confirmBody"></p>
    <div class="row end">
      <button class="btn" value="cancel" id="confirmCancel">Cancel</button>
      <button class="btn primary" value="ok" id="confirmOk">OK</button>
    </div>
  </form>
</dialog>
<div class="toast" id="toast"></div>
<div id="print"></div>

<!-- One script per part of the page; main.js wires them up and starts. -->
<script src="static/core.js"></script>
<script src="static/leads.js"></script>
<script src="static/drawer.js"></script>
<script src="static/outreach.js"></script>
<script src="static/results.js"></script>
<script src="static/settings.js"></script>
<script src="static/main.js"></script>
</body>
</html>
