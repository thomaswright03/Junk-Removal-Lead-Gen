<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lead Desk</title>
<link rel="icon" href="data:,">
<script>try { const t = localStorage.getItem("leaddesk.theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) { /* storage blocked */ }</script>
<link rel="stylesheet" href="static/app.css">
</head>
<body>
<header>
  <div>
    <h1>Lead Desk <span class="sub" id="purpose">· clean-out job leads for your junk-removal business</span></h1>
    <div class="sub" id="sub" role="status" aria-live="polite">Loading…</div>
    <div class="sub" id="jobs" role="status" aria-live="polite"></div>
  </div>
  <nav id="nav">
    <button data-tab="leads" class="on">Leads</button>
    <button data-tab="outreach">Outreach</button>
    <button data-tab="results">Results</button>
    <button data-tab="settings">Settings</button>
  </nav>
  <div class="spacer"></div>
  <label class="btn" title="Saved Justice Court case page or calendar page (.html), or a CSV of leads">
    Import court page / CSV
    <input type="file" id="importFile" accept=".html,.htm,.csv" hidden>
  </label>
  <button class="btn primary" id="refreshBtn" title="Search the court calendar for new evictions, read the case pages, look up landlords and their phones, and pull new Tucson code cases. Runs by itself every morning.">Check for new evictions</button>
</header>
<div class="banner" id="pausedBanner" hidden></div>

<main>
  <section id="tab-leads"></section>
  <section id="tab-outreach" hidden></section>
  <section id="tab-results" hidden></section>
  <section id="tab-settings" hidden></section>
</main>

<aside class="drawer" id="drawer"></aside>
<div class="toast" id="toast"></div>
<div id="print"></div>

<!-- One script per part of the page; main.js wires them up and starts. -->
<script src="static/core.js"></script>
<script src="static/leads.js"></script>
<script src="static/drawer.js"></script>
<script src="static/outreach.js"></script>
<script src="static/results.js"></script>
<script src="static/settings.js"></script>
<script src="static/main.js"></script>
</body>
</html>
