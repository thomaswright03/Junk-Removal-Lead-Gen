<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lead Desk</title>
<link rel="icon" href="data:,">
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --fg: #1c1c1e; --muted: #6b6b70; --line: #e4e4e0;
  --accent: #1f6feb; --accent-soft: #e8f0fe; --good: #1a7f37; --good-soft: #e6f4ea;
  --warn: #9a6700; --warn-soft: #fff4d6; --bad: #c62828; --bad-soft: #fdecea; --chip: #f0f0ec;
  --c-door_hanger: #8250df; --c-phone: #bf5700; --c-property_manager: #1a7f37;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121214; --panel: #1b1b1e; --fg: #ececee; --muted: #9b9ba3; --line: #2c2c31;
    --accent: #6ea8ff; --accent-soft: #1d2a40; --good: #4cc26b; --good-soft: #17301f;
    --warn: #e0b341; --warn-soft: #33290f; --bad: #ff6b6b; --bad-soft: #3a1a1a; --chip: #26262b;
    --c-door_hanger: #b18cff; --c-phone: #ff9f4a; --c-property_manager: #4cc26b;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
header h1 { font-size: 17px; margin: 0; }
header .sub { color: var(--muted); font-size: 13px; }
nav { display: flex; gap: 4px; margin-left: 12px; }
nav button { background: none; border: 0; padding: 7px 12px; border-radius: 8px; color: var(--muted); font: inherit; cursor: pointer; }
nav button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.spacer { flex: 1; }
main { padding: 20px; max-width: 1400px; margin: 0 auto; }
button.btn, label.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); padding: 7px 12px; border-radius: 8px; font: inherit; cursor: pointer; white-space: nowrap; }
button.btn:hover, label.btn:hover { border-color: var(--muted); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.small { padding: 3px 8px; font-size: 12px; }
button:disabled { opacity: .5; cursor: default; }
input, select, textarea { font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
textarea { width: 100%; min-height: 110px; resize: vertical; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; }
.card h2 { font-size: 15px; margin: 0 0 4px; }
.card h3 { font-size: 14px; margin: 14px 0 6px; }
.card p.hint, .hint { color: var(--muted); font-size: 13px; margin: 2px 0 10px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.grid4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
.kpi .v { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }
.kpi .l { color: var(--muted); font-size: 12px; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; color: var(--muted); font-weight: 600; background: var(--panel); }
tbody tr.click { cursor: pointer; }
tbody tr.click:hover { background: var(--accent-soft); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.tablewrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
.chip { display: inline-block; padding: 1px 8px; border-radius: 10px; background: var(--chip); font-size: 12px; white-space: nowrap; }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.acc { background: var(--accent-soft); color: var(--accent); }
.ch { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; white-space: nowrap; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.score { display: inline-block; min-width: 30px; text-align: center; font-weight: 650; border-radius: 6px; padding: 1px 6px; font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
a { color: var(--accent); }
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.filters input[type=search] { flex: 1; min-width: 200px; }
.drawer { position: fixed; top: 0; right: 0; width: min(520px, 100%); height: 100%; background: var(--panel); border-left: 1px solid var(--line); box-shadow: -8px 0 24px rgba(0,0,0,.12); overflow-y: auto; padding: 20px; z-index: 20; display: none; }
.drawer.open { display: block; }
.drawer h2 { margin: 0 32px 4px 0; font-size: 17px; }
.drawer .close { position: absolute; top: 14px; right: 14px; }
dl { display: grid; grid-template-columns: 120px 1fr; gap: 6px 10px; margin: 12px 0; }
dt { color: var(--muted); font-size: 13px; } dd { margin: 0; }
.script { white-space: pre-wrap; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; font-size: 13px; }
.bars { display: grid; gap: 10px; }
.bar { display: grid; grid-template-columns: 210px 1fr 80px; align-items: center; gap: 10px; }
.bar .track { height: 14px; background: var(--chip); border-radius: 7px; overflow: hidden; }
.bar .fill { height: 100%; border-radius: 7px; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 8px; display: none; z-index: 50; max-width: 90%; }
.empty { padding: 28px; text-align: center; color: var(--muted); }
.tabs2 { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.tabs2 button { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 6px 12px; cursor: pointer; font: inherit; color: var(--fg); }
.tabs2 button.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
#print { display: none; }
@media (max-width: 720px) { main { padding: 12px; } nav { margin-left: 0; overflow-x: auto; } .bar { grid-template-columns: 120px 1fr 60px; } }
@media print {
  body { background: #fff; color: #000; }
  header, main, .drawer, .toast { display: none !important; }
  #print { display: block; }
  .route { font: 11pt/1.4 Helvetica, sans-serif; }
  .route table { width: 100%; } .route td, .route th { border-bottom: 1px solid #ccc; padding: 4px 6px; position: static; }
}
</style>
</head>
<body>
<header>
  <div>
    <h1>Lead Desk</h1>
    <div class="sub" id="sub">Loading…</div>
  </div>
  <nav id="nav">
    <button data-tab="leads" class="on">Leads</button>
    <button data-tab="outreach">Outreach</button>
    <button data-tab="results">Results</button>
    <button data-tab="settings">Settings</button>
  </nav>
  <div class="spacer"></div>
  <label class="btn" title="Saved Justice Court case page or calendar page (.html), or a CSV of leads">
    Import court page / CSV
    <input type="file" id="importFile" accept=".html,.htm,.csv" hidden>
  </label>
  <button class="btn primary" id="refreshBtn" title="Search the court calendar for new evictions, read the case pages, look up landlords and their phones, and pull new Tucson code cases. Runs by itself every morning.">Check for new evictions</button>
</header>

<main>
  <section id="tab-leads"></section>
  <section id="tab-outreach" hidden></section>
  <section id="tab-results" hidden></section>
  <section id="tab-settings" hidden></section>
</main>

<aside class="drawer" id="drawer"></aside>
<div class="toast" id="toast"></div>
<div id="print"></div>

<script>
"use strict";
let S = null;                 // server state
const ui = { tab: "leads", q: "", type: "", status: "open", channel: "", sort: "score", outreachTab: "door_hanger", open: null };

const $ = (s, el = document) => el.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = v => v == null ? "–" : "$" + Number(v).toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 2 });
const pct = v => v == null ? "–" : (v * 100).toFixed(v < 0.1 && v > 0 ? 1 : 0) + "%";
const title = s => String(s ?? "").toLowerCase().replace(/\b\w/g, c => c.toUpperCase())
  .replace(/\b(Llc|Lllp|Lp|Po|Nw|Ne|Sw|Se|Hoa|Usa|Az)\b/g, w => w.toUpperCase());
// Assessor names are "LAST FIRST MIDDLE"; the first name is the second word.
const firstName = name => { const w = String(name || "").replace(/[&,].*$/, "").trim().split(/\s+/); return w.length > 1 && /^[A-Za-z]{2,}$/.test(w[1]) ? title(w[1]) : ""; };

async function api(path, body) {
  const opt = body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) };
  const r = await fetch(path, opt);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
function toast(msg, ms = 3200) {
  const t = $("#toast"); t.textContent = msg; t.style.display = "block";
  clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = "none", ms);
}
async function load() {
  S = await api("/api/state");
  render();
}
async function act(fn, okMsg) {
  try { const r = await fn(); if (okMsg) toast(typeof okMsg === "function" ? okMsg(r) : okMsg); await load(); return r; }
  catch (e) { toast("Error: " + e.message, 6000); }
}

// ---------- helpers ---------------------------------------------------------
const chName = c => S.channels[c] || "Unassigned";
const chDot = c => c ? `<span class="ch"><span class="dot" style="background:var(--c-${c})"></span>${esc(chName(c))}</span>` : `<span class="muted">–</span>`;
function scoreChip(s) {
  const cls = s >= 60 ? "good" : s >= 40 ? "acc" : s >= 25 ? "warn" : "";
  return `<span class="score chip ${cls}">${s}</span>`;
}
function statusChip(s) {
  const m = { new: "acc", contacted: "", responded: "warn", quoted: "warn", won: "good", lost: "bad", skip: "", stale: "" };
  return `<span class="chip ${m[s] || ""}">${esc(s)}</span>`;
}
function whatLabel(l) {
  if (l.lead_type === "eviction") return "Eviction";
  if (l.lead_type === "civil") return "Civil case";
  return l.code_label || (l.description || "").split(" | ")[0] || l.lead_type;
}
function mapUrl(l) {
  if (l.lat != null && l.lon != null) return `https://www.google.com/maps/search/?api=1&query=${l.lat},${l.lon}`;
  if (l.address) return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(l.address + ", " + (l.city || "Tucson") + ", AZ");
  return null;
}
function ownerLine(l) {
  const who = l.owner_name || l.plaintiff;
  if (!who) return `<span class="muted">${l.enriched_at ? "not found" : "lookup pending"}</span>`;
  let tags = "";
  if (l.owner_absentee) tags += ` <span class="chip warn" title="Owner's mailing address is somewhere else">absentee</span>`;
  if (l.owner_entity) tags += ` <span class="chip" title="Company, trust or estate">entity</span>`;
  if (l.owner_lead_count > 1) tags += ` <span class="chip acc" title="Owner has several leads">${l.owner_lead_count} leads</span>`;
  return esc(title(who)) + tags;
}
function fill(channel, l) {
  const st = S.settings, owner = (l.owner_name || l.plaintiff || "").trim();
  const first = owner && !l.owner_entity ? firstName(owner) : "";
  const phone = (st.tracking_numbers || {})[channel] || st.business_phone || "[phone]";
  return (st.templates[channel] || "")
    .replaceAll("{owner}", title(owner) || "Property Owner")
    .replaceAll("{owner_first}", first || "there")
    .replaceAll("{address}", title(l.address) || "your property")
    .replaceAll("{phone}", phone)
    .replaceAll("{business}", st.business_name || "");
}
function noticeChip(l) {
  if (l.lead_type !== "eviction") return "";
  if (l.eviction_notice === 1) return ` <span class="chip good" title="An eviction notice is filed in the court case">notice filed</span>`;
  if (l.eviction_notice === 0) return ` <span class="chip" title="No eviction notice in the case documents yet">no notice yet</span>`;
  return ` <span class="chip warn" title="Case page not read yet. Add the case link or press Update court cases.">case not checked</span>`;
}
const courtDate = v => v ? v.replace(/^(\d{4})-(\d\d)-(\d\d)(?: (\d\d:\d\d))?$/, (m, y, mo, d, t) => `${+mo}/${+d}/${y}${t ? " " + t : ""}`) : "";
const VIEW_LABEL = { eviction_notice: "Evictions with an eviction notice", evictions: "All evictions", all: "All leads (code cases too)" };
async function addCases(text, btn) {
  if (!text.trim()) return toast("Paste one or more case page links first.");
  btn.disabled = true; const label = btn.textContent; btn.textContent = "Reading cases…";
  await act(() => api("/api/cases/add", { text }), r =>
    `Cases: ${r.new} new, ${r.updated} updated, ${r.with_notice} with an eviction notice` +
    (r.failed ? `, ${r.failed} could not be read` : "") + (r.skipped.length ? `. Skipped (not case links): ${r.skipped.slice(0, 3).join(", ")}` : ""));
  btn.disabled = false; btn.textContent = label;
}
async function updateCases(btn) {
  btn.disabled = true; const label = btn.textContent; btn.textContent = "Checking cases…";
  await act(() => api("/api/cases/update", { force: true }), r =>
    `Re-read ${r.checked} court cases, ${r.with_notice} with an eviction notice` + (r.failed ? `, ${r.failed} failed` : ""));
  btn.disabled = false; btn.textContent = label;
}
function activeLeads() {
  return S.leads.filter(l => l.status !== "stale" && l.status !== "skip");
}
function untouched(l) { return !l.touches.length; }
const SOURCE_LABEL = { manual: "entered by hand", import: "imported file", osm: "OpenStreetMap", google: "Google Places",
  "osm+website": "OpenStreetMap + company website", "google+website": "Google Places + company website", website: "company website" };
function phoneCell(l) {
  return l.owner_phone ? `<a href="tel:${esc(l.owner_phone.replace(/\D/g, ""))}">${esc(l.owner_phone)}</a>` : '<span class="muted">–</span>';
}
function emailCell(l) {
  return l.owner_email ? `<a href="mailto:${esc(l.owner_email)}">${esc(l.owner_email)}</a>` : '<span class="muted">–</span>';
}
async function findContacts(btn) {
  btn.disabled = true; const label = btn.textContent; btn.textContent = "Looking up…";
  await act(() => api("/api/find-contacts", {}), r =>
    `Checked ${r.checked} companies: contacts found for ${r.found} leads, none for ${r.not_found}.` +
    (r.google_used ? "" : " Add a Google Places key in Settings to find more.") + (r.errors ? ` ${r.errors} lookups failed.` : ""));
  btn.disabled = false; btn.textContent = label;
}
async function importContacts(file) {
  await act(async () => {
    const r = await fetch(`/api/import?source=contacts&filename=${encodeURIComponent(file.name)}`, { method: "POST", body: await file.arrayBuffer() });
    const j = await r.json(); if (!r.ok) throw new Error(j.error); return j;
  }, r => `Contacts: ${r.matched} of ${r.rows} rows matched a lead, ${r.updated} leads updated`);
}

// ---------- header ----------------------------------------------------------
function renderHeader() {
  const open = activeLeads();
  const assigned = open.filter(l => l.channel).length;
  const pending = S.leads.filter(l => !l.enriched_at).length;
  const d = S.daily || {};
  const msg = d.message || "starting the daily check";
  const daily = d.running ? `${msg[0].toUpperCase() + msg.slice(1)}…`
    : d.last_run ? `Last check ${d.last_run}: ${d.summary}` : "Not checked yet today";
  $("#sub").textContent = `${open.length} open leads · ${assigned} in outreach` + (pending ? ` · ${pending} owners not looked up yet` : "") + ` · ${daily}`;
  const b = $("#refreshBtn"); b.disabled = !!d.running; b.textContent = d.running ? "Checking…" : "Check for new evictions";
  if (d.running) watchDaily();
  document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === ui.tab));
  for (const t of ["leads", "outreach", "results", "settings"]) $("#tab-" + t).hidden = t !== ui.tab;
}

// ---------- Leads tab -------------------------------------------------------
function filteredLeads() {
  const q = ui.q.toLowerCase();
  let rows = S.leads.filter(l => {
    if (ui.status === "open" && ["stale", "skip", "lost", "won"].includes(l.status)) return false;
    if (ui.status && ui.status !== "open" && l.status !== ui.status) return false;
    if (ui.type === "eviction" && l.lead_type !== "eviction") return false;
    if (ui.type === "code_violation" && l.lead_type !== "code_violation") return false;
    if (ui.type === "absentee" && !l.owner_absentee) return false;
    if (ui.type === "entity" && !l.owner_entity) return false;
    if (ui.type === "has_phone" && !l.owner_phone) return false;
    if (ui.type === "no_phone" && l.owner_phone) return false;
    if (ui.channel === "none" && l.channel) return false;
    if (ui.channel && ui.channel !== "none" && l.channel !== ui.channel) return false;
    if (q && ![l.address, l.owner_name, l.plaintiff, l.defendant, l.source_id, l.description, l.parcel, l.notes, l.owner_phone, l.owner_email, l.contact_name].join(" ").toLowerCase().includes(q)) return false;
    return true;
  });
  const key = ui.sort;
  rows.sort((a, b) => key === "score" ? b.score - a.score || (b.event_date || "").localeCompare(a.event_date || "")
    : key === "date" ? (b.event_date || "").localeCompare(a.event_date || "")
    : key === "miles" ? (a.miles ?? 1e9) - (b.miles ?? 1e9) : 0);
  return rows;
}
function renderLeads() {
  const rows = filteredLeads();
  const opts = (pairs, cur) => pairs.map(([v, t]) => `<option value="${v}" ${v === cur ? "selected" : ""}>${t}</option>`).join("");
  const vc = S.view_counts || {}, view = S.settings.lead_view || "eviction_notice";
  const emptyMsg = view === "all" ? "No leads match. Try “Any status”, or press Check for new evictions."
    : (S.daily || {}).running ? "Checking the court calendar for evictions. New cases show up here as their case pages are read."
    : `No ${view === "eviction_notice" ? "eviction cases with an eviction notice" : "eviction cases"} yet. Press <b>Check for new evictions</b>
       to search the court calendar now (it also runs by itself every morning), or paste case links above.` +
      (vc.unchecked ? ` ${vc.unchecked} eviction cases haven't been checked for a notice yet.` : "");
  $("#tab-leads").innerHTML = `
    <div class="card" style="margin-bottom:12px">
      <div class="row">
        <label>Show <select id="fView">${opts(Object.entries(VIEW_LABEL).map(([v, t]) => [v, `${t} (${vc[v] ?? 0})`]), view)}</select></label>
        <button class="btn" id="cUpdate" title="Re-read every open eviction case page for new documents and court dates">Update court cases</button>
      </div>
      <div class="row" style="margin-top:8px">
        <input type="text" id="cLinks" style="flex:1;min-width:260px" placeholder="Paste Justice Court case links, e.g. https://www.jp.pima.gov/CaseSearch/jcDisplayCase.aspx?ID=1234567">
        <button class="btn primary" id="cAdd">Add cases</button>
      </div>
      <p class="hint" style="margin-bottom:0">Every morning Lead Desk searches the Justice Court calendar for eviction hearings, reads each new case page (with a short pause between cases) and keeps cases whose documents include an eviction notice. You can also paste case links here.</p>
    </div>
    <div class="row" style="margin-bottom:10px">
      <button class="btn" id="lFind" title="Look up office phone, email and website for landlords, LLC owners and apartment complexes">Find landlord phones &amp; emails</button>
      <a class="btn" href="/api/skiptrace.csv" download="skiptrace.csv" style="text-decoration:none" title="Owners still missing a phone, formatted for a skip-tracing service">Download skip-trace list</a>
      <label class="btn" title="CSV with phone/email columns (from a skip-tracing service or your own list)">Import phones / emails<input type="file" id="lImport" accept=".csv" hidden></label>
      <span class="muted" style="font-size:13px">${S.leads.filter(l => l.owner_phone).length} leads have a phone, ${S.leads.filter(l => l.owner_email).length} an email</span>
    </div>
    <div class="filters">
      <input type="search" id="q" placeholder="Search address, owner, landlord, case, parcel…" value="${esc(ui.q)}">
      <select id="fType">${opts([["", "All leads"], ["code_violation", "Code cases"], ["eviction", "Evictions"], ["absentee", "Absentee owners"], ["entity", "Owned by LLC / trust"], ["has_phone", "Has a phone"], ["no_phone", "No phone yet"]], ui.type)}</select>
      <select id="fStatus">${opts([["open", "Open (not won/lost)"], ["", "Any status"], ...S.statuses.map(s => [s, title(s)])], ui.status)}</select>
      <select id="fChannel">${opts([["", "Any channel"], ["none", "Not assigned"], ...Object.entries(S.channels)], ui.channel)}</select>
      <select id="fSort">${opts([["score", "Best first"], ["date", "Newest first"], ["miles", "Closest first"]], ui.sort)}</select>
    </div>
    <div class="tablewrap"><table>
      <thead><tr><th class="num">Score</th><th>Date</th><th>What</th><th>Property</th><th>Owner / landlord</th><th>Phone</th><th>Email</th><th class="num">Miles</th><th>Channel</th><th>Status</th></tr></thead>
      <tbody>${rows.map(l => `<tr class="click" data-id="${l.id}">
        <td class="num">${scoreChip(l.score)}</td>
        <td style="white-space:nowrap">${esc(l.event_date || "")}</td>
        <td>${esc(whatLabel(l))}${noticeChip(l)}${l.next_court_date ? `<div class="muted" style="font-size:12px">court ${esc(courtDate(l.next_court_date))}</div>` : ""}</td>
        <td>${l.address ? esc(title(l.address)) : '<span class="muted">address needed</span>'}${l.property_use ? `<div class="muted" style="font-size:12px">${esc(title(l.property_use))}</div>` : ""}</td>
        <td>${ownerLine(l)}</td>
        <td style="white-space:nowrap">${phoneCell(l)}</td>
        <td>${emailCell(l)}</td>
        <td class="num">${l.miles != null ? l.miles.toFixed(1) : "–"}</td>
        <td>${chDot(l.channel)}</td>

function routeOrder(q) {
  // Nearest-neighbour walk starting from Steve's base.
  const left = q.filter(l => l.lat != null), out = [];
  let cur = { lat: S.settings.base_lat, lon: S.settings.base_lon };
  if (cur.lat == null && left.length) cur = left[0];
  const d = (a, b) => Math.hypot(a.lat - b.lat, (a.lon - b.lon) * Math.cos(a.lat * Math.PI / 180));
  while (left.length) {
    let bi = 0; left.forEach((l, i) => { if (d(cur, l) < d(cur, left[bi])) bi = i; });
    cur = left.splice(bi, 1)[0]; out.push(cur);
  }
  return out.concat(q.filter(l => l.lat == null));
}

    </div>
    <div class="card"><h2>Response rate</h2><p class="hint">Share of contacted leads that called back or said yes.</p>
      <div class="bars">${R.map(r => bar(r, r.response_rate || 0, maxRate, pct(r.response_rate))).join("")}</div></div>
    <div class="card"><h2>Revenue per dollar spent</h2><p class="hint">Phone and property-manager outreach cost Steve's time, not cash; add a cost per contact in Settings to compare them fairly.</p>
      <div class="bars">${R.map(r => bar(r, r.revenue_per_dollar || 0, maxRpd, r.revenue_per_dollar == null ? (r.revenue ? "free" : "–") : money(r.revenue_per_dollar))).join("")}</div></div>`;
}
const bar = (r, v, max, label) => `<div class="bar"><div>${chDot(r.channel)}</div><div class="track"><div class="fill" style="width:${Math.round(100 * v / max)}%;background:var(--c-${r.channel})"></div></div><div class="num" style="text-align:right">${label}</div></div>`;

// ---------- Settings tab ----------------------------------------------------
function renderSettings() {
  const st = S.settings;
  $("#tab-settings").innerHTML = `
    <div class="card"><h2>Business</h2>
      <div class="grid4">
        <label>Business name<br><input id="sName" value="${esc(st.business_name)}" style="width:100%"></label>
        <label>Main phone<br><input id="sPhone" value="${esc(st.business_phone)}" placeholder="(520) 555-0100" style="width:100%"></label>
        <label>Base address (for miles and routes)<br><input id="sBase" value="${esc(st.base_address)}" style="width:100%"></label>
      </div>
      <p class="hint">${st.base_lat != null ? `Base located at ${(+st.base_lat).toFixed(4)}, ${(+st.base_lon).toFixed(4)}.` : "Base not located yet; it's looked up when you save or refresh."}</p>
    </div>
    <div class="card"><h2>Phone and email lookup</h2>
      <p class="hint">“Find landlord phones &amp; emails” always checks OpenStreetMap and company websites for free. A Google Places API key (Google Maps Platform, pay per lookup after the monthly free credit) finds far more office numbers. Google's terms limit how long results may be kept, so Google-found contacts are re-checked after 30 days.</p>
      <div class="row"><input id="sGoogle" type="password" placeholder="${st.google_key_set ? "Key saved. Paste a new one to replace it" : "Google Places API key"}" style="flex:1;min-width:260px" autocomplete="off">
      ${st.google_key_set ? `<span class="chip good">key saved</span> <button class="btn small" id="sGoogleClear">Remove key</button>` : `<span class="chip">no key</span>`}</div>
    </div>
    <div class="card"><h2>Channels</h2>
      <p class="hint">A separate tracking phone number per channel (Google Voice, CallRail and similar) is the cleanest way to know which channel a caller came from. Cost is what one contact costs, including printing and postage.</p>
      <div class="tablewrap"><table><thead><tr><th>Channel</th><th>Cost per contact $</th><th>Tracking number</th></tr></thead><tbody>
      ${Object.entries(S.channels).map(([c, n]) => `<tr><td>${chDot(c)}</td><td><input type="number" step="0.01" min="0" data-cost="${c}" value="${st.costs[c] ?? 0}" style="width:90px"></td>
        <td><input data-track="${c}" value="${esc(st.tracking_numbers[c] || "")}" placeholder="uses main phone"></td></tr>`).join("")}</tbody></table></div></div>
    <div class="card"><h2>Messages</h2><p class="hint">Fields: {owner}, {owner_first}, {address}, {phone}, {business}.</p>
      ${Object.entries(S.channels).map(([c, n]) => `<h3>${esc(n)}</h3><textarea data-tpl="${c}">${esc(st.templates[c] || "")}</textarea>`).join("")}
    </div>
    <button class="btn primary" id="sSave">Save settings</button>`;
  const gc = $("#sGoogleClear");
  if (gc) gc.onclick = () => act(() => api("/api/settings", { clear_google_key: true }), "Google key removed");
  $("#sSave").onclick = () => {
    const costs = {}, tracking = {}, templates = {};
    document.querySelectorAll("[data-cost]").forEach(i => costs[i.dataset.cost] = Number(i.value || 0));
    document.querySelectorAll("[data-track]").forEach(i => tracking[i.dataset.track] = i.value.trim());
    document.querySelectorAll("[data-tpl]").forEach(i => templates[i.dataset.tpl] = i.value);
    act(() => api("/api/settings", { business_name: $("#sName").value.trim(), business_phone: $("#sPhone").value.trim(), base_address: $("#sBase").value.trim(), google_places_api_key: $("#sGoogle").value.trim(), costs, tracking_numbers: tracking, templates }), "Settings saved");
  };
}

// ---------- wiring ----------------------------------------------------------
function render() {
  renderHeader();
  if (ui.tab === "leads") renderLeads();
  if (ui.tab === "outreach") renderOutreach();
  if (ui.tab === "results") renderResults();
  if (ui.tab === "settings") renderSettings();
  if (ui.open) renderDrawer();
}
document.querySelectorAll("#nav button").forEach(b => b.onclick = () => { ui.tab = b.dataset.tab; render(); });
$("#refreshBtn").onclick = async () => {
  await act(() => api("/api/refresh", {}), "Checking the court calendar. This page updates as cases come in.");
};
// While the daily check runs, reload every few seconds so new cases appear.
function watchDaily() {
  if (watchDaily.t) return;
  watchDaily.t = setInterval(async () => {
    try {
      S = await api("/api/state");
      if (!S.daily.running) { clearInterval(watchDaily.t); watchDaily.t = null; toast("Done: " + (S.daily.summary || S.daily.message || ""), 8000); }
      // Don't redraw under someone typing in a box.
      const typing = document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
      if (typing && S.daily.running) renderHeader(); else render();
    } catch (e) { /* keep trying */ }
  }, 5000);
}
$("#importFile").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  const source = /\.csv$/i.test(f.name) ? "csv_import" : "pima_jp_calendar";
  await act(async () => {
    const r = await fetch(`/api/import?source=${source}&filename=${encodeURIComponent(f.name)}`, { method: "POST", body: await f.arrayBuffer() });
    const j = await r.json(); if (!r.ok) throw new Error(j.error); return j;
  }, r => `Imported ${r.new} new, ${r.updated} updated` + (r.with_notice != null ? (r.with_notice ? " · eviction notice filed" : " · no eviction notice in this case yet") : ""));
  e.target.value = "";
};
document.addEventListener("keydown", e => { if (e.key === "Escape" && ui.open) { ui.open = null; $("#drawer").classList.remove("open"); } });
load().catch(e => { $("#sub").textContent = "Could not load: " + e.message; });
</script>
</body>
