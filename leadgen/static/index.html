<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lead Desk</title>
<link rel="icon" href="data:,">
<script>try { const t = localStorage.getItem("leaddesk.theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) { /* storage blocked */ }</script>
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --fg: #1c1c1e; --muted: #64646a; --line: #e4e4e0;
  --accent: #1f6feb; --on-accent: #ffffff; --accent-soft: #e8f0fe; --good: #1a7f37; --good-soft: #e6f4ea;
  --warn: #8a5c00; --warn-soft: #fff4d6; --bad: #c62828; --bad-soft: #fdecea; --chip: #f0f0ec;
  --c-door_hanger: #8250df; --c-phone: #bf5700; --c-property_manager: #1a7f37;
  --radius: 10px;
  color-scheme: light;
}
/* Dark theme: when the computer is set to dark and no theme is picked in
   Settings, or when Dark is picked. Primary buttons use dark text on the
   light blue (about 8:1 contrast; white on it was 2.4:1). */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121214; --panel: #1b1b1e; --fg: #ececee; --muted: #a2a2aa; --line: #2c2c31;
    --accent: #6ea8ff; --on-accent: #0b1424; --accent-soft: #1d2a40; --good: #4cc26b; --good-soft: #17301f;
    --warn: #e0b341; --warn-soft: #33290f; --bad: #ff6b6b; --bad-soft: #3a1a1a; --chip: #26262b;
    --c-door_hanger: #b18cff; --c-phone: #ff9f4a; --c-property_manager: #4cc26b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121214; --panel: #1b1b1e; --fg: #ececee; --muted: #a2a2aa; --line: #2c2c31;
  --accent: #6ea8ff; --on-accent: #0b1424; --accent-soft: #1d2a40; --good: #4cc26b; --good-soft: #17301f;
  --warn: #e0b341; --warn-soft: #33290f; --bad: #ff6b6b; --bad-soft: #3a1a1a; --chip: #26262b;
  --c-door_hanger: #b18cff; --c-phone: #ff9f4a; --c-property_manager: #4cc26b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
header h1 { font-size: 17px; margin: 0; }
header .sub { color: var(--muted); font-size: 13px; }
#purpose { font-weight: 400; }
nav { display: flex; gap: 4px; margin-left: 12px; }
nav button { background: none; border: 0; padding: 7px 12px; border-radius: 8px; color: var(--muted); font: inherit; cursor: pointer; }
nav button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.spacer { flex: 1; }
main { padding: 20px; max-width: 1400px; margin: 0 auto; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); padding: 7px 12px; border-radius: 8px; font: inherit; line-height: 1.45; cursor: pointer; white-space: nowrap; text-decoration: none; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.small { padding: 3px 8px; font-size: 12px; }
.btn.danger { color: var(--bad); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
tbody tr.click:focus-visible { outline-offset: -2px; }
.banner { background: var(--warn-soft); color: var(--warn); border-bottom: 1px solid var(--line); padding: 8px 20px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.banner[hidden] { display: none; }
.job { display: inline-flex; gap: 8px; align-items: center; }
.job progress { width: 120px; }
button:disabled { opacity: .5; cursor: default; }
button[aria-busy="true"] { cursor: progress; }
input, select, textarea { font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
textarea { width: 100%; min-height: 110px; resize: vertical; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; }
.card h2 { font-size: 15px; margin: 0 0 4px; }
.card h3 { font-size: 14px; margin: 14px 0 6px; }
.card p.hint, .hint { color: var(--muted); font-size: 13px; margin: 2px 0 10px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.grid4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
.kpi .v { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }
.kpi .l { color: var(--muted); font-size: 12px; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; color: var(--muted); font-weight: 600; background: var(--panel); }
tbody tr.click { cursor: pointer; }
tbody tr.click:hover { background: var(--accent-soft); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.tablewrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
.chip { display: inline-block; padding: 1px 8px; border-radius: 10px; background: var(--chip); font-size: 12px; white-space: nowrap; }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.acc { background: var(--accent-soft); color: var(--accent); }
.ch { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; white-space: nowrap; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.score { display: inline-block; min-width: 30px; text-align: center; font-weight: 650; border-radius: 6px; padding: 1px 6px; font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
a { color: var(--accent); }
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.filters input[type=search] { flex: 1; min-width: 200px; }
.drawer { position: fixed; top: 0; right: 0; width: min(520px, 100%); height: 100%; background: var(--panel); border-left: 1px solid var(--line); box-shadow: -8px 0 24px rgba(0,0,0,.12); overflow-y: auto; padding: 20px; z-index: 20; display: none; }
.drawer.open { display: block; }
.drawer h2 { margin: 0 32px 4px 0; font-size: 17px; }
.drawer .close { position: absolute; top: 14px; right: 14px; }
dl { display: grid; grid-template-columns: 120px 1fr; gap: 6px 10px; margin: 12px 0; }
dt { color: var(--muted); font-size: 13px; } dd { margin: 0; }
.script { white-space: pre-wrap; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; font-size: 13px; }
.bars { display: grid; gap: 10px; }
.bar { display: grid; grid-template-columns: 210px 1fr 80px; align-items: center; gap: 10px; }
.bar .track { height: 14px; background: var(--chip); border-radius: 7px; overflow: hidden; }
.bar .fill { height: 100%; border-radius: 7px; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 8px; display: none; z-index: 50; max-width: 90%; }
.toast .btn { margin-left: 8px; }
.empty { padding: 28px; text-align: center; color: var(--muted); }
.tabs2 { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.tabs2 button { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 6px 12px; cursor: pointer; font: inherit; color: var(--fg); }
.tabs2 button.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
#print { display: none; }
@media (max-width: 720px) { main { padding: 12px; } nav { margin-left: 0; overflow-x: auto; } .bar { grid-template-columns: 120px 1fr 60px; } }
@media print {
  body { background: #fff; color: #000; }
  header, main, .drawer, .toast { display: none !important; }
  #print { display: block; }
  .route { font: 11pt/1.4 Helvetica, sans-serif; }
  .route table { width: 100%; } .route td, .route th { border-bottom: 1px solid #ccc; padding: 4px 6px; position: static; }
}
</style>
</head>
<body>
<header>
  <div>
    <h1>Lead Desk <span class="sub" id="purpose">· clean-out job leads for your junk-removal business</span></h1>
    <div class="sub" id="sub" role="status" aria-live="polite">Loading…</div>
    <div class="sub" id="jobs" role="status" aria-live="polite"></div>
  </div>
  <nav id="nav">
    <button data-tab="leads" class="on">Leads</button>
    <button data-tab="outreach">Outreach</button>
    <button data-tab="results">Results</button>
    <button data-tab="settings">Settings</button>
  </nav>
  <div class="spacer"></div>
  <label class="btn" title="Saved Justice Court case page or calendar page (.html), or a CSV of leads">
    Import court page / CSV
    <input type="file" id="importFile" accept=".html,.htm,.csv" hidden>
  </label>
  <button class="btn primary" id="refreshBtn" title="Search the court calendar for new evictions, read the case pages, look up landlords and their phones, and pull new Tucson code cases. Runs by itself every morning.">Check for new evictions</button>
</header>
<div class="banner" id="pausedBanner" hidden></div>

<main>
  <section id="tab-leads"></section>
  <section id="tab-outreach" hidden></section>
  <section id="tab-results" hidden></section>
  <section id="tab-settings" hidden></section>
</main>

<aside class="drawer" id="drawer"></aside>
<div class="toast" id="toast"></div>
<div id="print"></div>

<script>
"use strict";
let S = null;                 // server state
const ui = { tab: "leads", q: "", type: "", status: "open", channel: "", sort: "score", outreachTab: "door_hanger", open: null };

const $ = (s, el = document) => el.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = v => v == null ? "–" : "$" + Number(v).toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 2 });
const pct = v => v == null ? "–" : (v * 100).toFixed(v < 0.1 && v > 0 ? 1 : 0) + "%";
const title = s => String(s ?? "").toLowerCase().replace(/\b\w/g, c => c.toUpperCase())
  .replace(/\b(Llc|Lllp|Lp|Po|Nw|Ne|Sw|Se|Hoa|Usa|Az)\b/g, w => w.toUpperCase());
// Assessor names are "LAST FIRST MIDDLE"; the first name is the second word.
const firstName = name => { const w = String(name || "").replace(/[&,].*$/, "").trim().split(/\s+/); return w.length > 1 && /^[A-Za-z]{2,}$/.test(w[1]) ? title(w[1]) : ""; };

const OFFLINE = "Lead Desk didn't answer. Check that it is still running (and your internet connection), then try again.";
async function api(path, body) {
  const opt = body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) };
  return send(path, opt);
}
async function send(path, opt) {
  let r;
  try { r = await fetch(path, opt); } catch (e) { throw new Error(OFFLINE); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || (r.status >= 500 ? "Something went wrong on the Lead Desk server. Try again in a minute." : "That didn't work. Reload the page and try again."));
  return j;
}
function toast(msg, ms = 3200, undo) {
  const t = $("#toast");
  t.innerHTML = esc(msg) + (undo ? ` <button class="btn small" id="toastUndo">Undo</button>` : "");
  t.style.display = "block";
  if (undo) $("#toastUndo").onclick = () => { t.style.display = "none"; undo(); };
  clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = "none", undo ? Math.max(ms, 8000) : ms);
}
async function load() {
  S = await api("/api/state");
  render();
}
// Run one action: the button is disabled while it runs (so a double click
// can't log twice), the page reloads, then the result is shown in a toast
// (so the toast never describes leads the list isn't showing yet).
async function act(fn, okMsg, btn, undo) {
  if (btn) { if (btn.disabled) return; btn.disabled = true; btn.setAttribute("aria-busy", "true"); }
  try {
    const r = await fn();
    await load();
    const msg = okMsg && (typeof okMsg === "function" ? okMsg(r) : okMsg);
    if (msg) toast(msg, Math.max(3200, msg.length * 60), undo);
    return r;
  }
  catch (e) { toast(e.message, 8000); }
  finally { if (btn) { btn.disabled = false; btn.removeAttribute("aria-busy"); } }
}

// ---------- helpers ---------------------------------------------------------
const chName = c => S.channels[c] || "Unassigned";
const chDot = c => c ? `<span class="ch"><span class="dot" style="background:var(--c-${c})"></span>${esc(chName(c))}</span>` : `<span class="muted">–</span>`;
function scoreChip(s) {
  const cls = s >= 60 ? "good" : s >= 40 ? "acc" : s >= 25 ? "warn" : "";
  return `<span class="score chip ${cls}">${s}</span>`;
}
function statusChip(s) {
  const m = { new: "acc", contacted: "", responded: "warn", quoted: "warn", won: "good", lost: "bad", skip: "", stale: "" };
  return `<span class="chip ${m[s] || ""}">${esc(STATUS_LABEL[s] || s)}</span>`;
}
function whatLabel(l) {
  if (l.lead_type === "eviction") return "Eviction";
  if (l.lead_type === "civil") return "Civil case";
  return l.code_label || (l.description || "").split(" | ")[0] || l.lead_type;
}
function mapUrl(l) {
  if (l.lat != null && l.lon != null) return `https://www.google.com/maps/search/?api=1&query=${l.lat},${l.lon}`;
  if (l.address) return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(l.address + ", " + (l.city || "Tucson") + ", AZ");
  return null;
}
function ownerLine(l) {
  const who = l.owner_name || l.plaintiff;
  if (!who) return `<span class="muted">${l.enriched_at ? "not found" : "lookup pending"}</span>`;
  let tags = "";
  if (l.owner_absentee) tags += ` <span class="chip warn" title="Owner's mailing address is somewhere else">owner lives elsewhere</span>`;
  if (l.owner_entity) tags += ` <span class="chip" title="Company, trust or estate">company owner</span>`;
  if (l.owner_lead_count > 1) tags += ` <span class="chip acc" title="Owner has several leads">${l.owner_lead_count} leads</span>`;
  return esc(title(who)) + tags;
}
// The one message renderer: fills a template from Settings for one lead.
// Phone calls on eviction cases use the landlord script, code cases the owner one.
const templateKey = (channel, l) => channel === "phone" && l.lead_type === "eviction" ? "phone_eviction" : channel;
function fill(channel, l) {
  const st = S.settings, owner = (l.owner_name || l.plaintiff || "").trim();
  const first = owner && !l.owner_entity ? firstName(owner) : "";
  const phone = (st.tracking_numbers || {})[channel] || st.business_phone || "[phone]";
  const addr = title(fullAddress(l));
  return (st.templates[templateKey(channel, l)] || st.templates[channel] || "")
    .replaceAll("{owner}", title(owner) || "Property Owner")
    .replaceAll("{owner_first}", first || "there")
    .replaceAll("{at_address}", addr ? ` at ${addr}` : "")
    .replaceAll("{address}", addr || "your property")
    .replaceAll("{phone}", phone)
    .replaceAll("{business}", st.business_name || "");
}
// Where the eviction case is: notice filed, judgment, writ (lockout), etc.
function noticeChip(l) {
  if (l.lead_type !== "eviction") return "";
  const stage = l.case_stage;
  if (stage === "writ") return ` <span class="chip bad" title="Writ of restitution: the tenant is being locked out, so the unit needs clearing now">writ issued${l.writ_date ? " " + esc(fmtDate(l.writ_date)) : ""}</span>`;
  if (stage === "judgment") return ` <span class="chip warn" title="The court ruled for the landlord; a writ (lockout) usually follows within days">judgment${l.judgment_date ? " " + esc(fmtDate(l.judgment_date)) : ""}</span>`;
  if (stage === "dismissed") return ` <span class="chip" title="The case was dismissed">dismissed</span>`;
  if (l.eviction_notice === 1) return ` <span class="chip good" title="An eviction notice is filed in the court case">notice filed</span>`;
  if (l.eviction_notice === 0) return ` <span class="chip" title="No eviction notice in the case documents yet">no notice yet</span>`;
  return ` <span class="chip warn" title="${l.url ? "Case page not read yet; the daily check reads it, or press Update court cases." : "Added by you, with no court case link to check."}">${l.url ? "case not checked" : "added by you"}</span>`;
}
// One date format everywhere: "Oct 1, 2026" and "2:00 PM". Plain dates are
// shown as they are; timestamps (stored in UTC) are shown in Tucson time.
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const fmtTime = (h, m) => `${(+h % 12) || 12}:${m} ${+h < 12 ? "AM" : "PM"}`;
function fmtDate(v) {
  if (!v) return "";
  const s = String(v);
  if (/T\d\d:\d\d/.test(s)) {
    const d = new Date(s);
    if (!isNaN(d)) return d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric", timeZone: "America/Phoenix" });
  }
  const m = s.match(/^(\d{4})-(\d\d)-(\d\d)/);
  return m ? `${MONTHS[+m[2] - 1]} ${+m[3]}, ${m[1]}` : s;
}
function fmtDateTime(v) {
  if (!v) return "";
  const d = new Date(v);
  return isNaN(d) ? fmtDate(v) : d.toLocaleString("en-US", { month: "short", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit", timeZone: "America/Phoenix" });
}
const courtDate = v => { if (!v) return ""; const m = String(v).match(/ (\d\d):(\d\d)$/); return fmtDate(v) + (m ? `, ${fmtTime(m[1], m[2])}` : ""); };
const STATUS_LABEL = { new: "New", contacted: "Contacted", responded: "Responded", quoted: "Quoted", won: "Won", lost: "Lost", skip: "Skip", stale: "Old" };
const fullAddress = l => l.address ? l.address + (l.unit ? " #" + String(l.unit).replace(/^#/, "") : "") : "";
const VIEW_LABEL = { eviction_notice: "Evictions with a notice, judgment or writ", evictions: "All evictions", all: "All leads (code cases too)" };
async function addCases(text, btn) {
  if (!text.trim()) return toast("Paste one or more case page links first.");
  await act(() => api("/api/cases/add", { text }), r => r.paused ? r.message :
    `Cases: ${r.new} new, ${r.updated} updated, ${r.with_notice} with an eviction notice` +
    (r.failed ? `, ${r.failed} could not be read (the court site may be busy; try again later)` : "") + (r.skipped.length ? `. Skipped (not case links): ${r.skipped.slice(0, 3).join(", ")}` : ""), btn);
}
// "Update court cases" and "Find landlord phones" run in the background on
// this computer (progress shows in the header); online they do one batch.
const JOB_DONE = {
  cases: r => `Re-read ${r.checked} court case${r.checked === 1 ? "" : "s"}, ${r.with_notice} with an eviction notice` + (r.failed ? `, ${r.failed} couldn't be read` : "") + (r.cancelled ? " (cancelled)" : r.stopped_early ? ". More remain; press again to continue." : "."),
  contacts: r => `Checked ${r.checked} companies: contacts found for ${r.found} leads, none for ${r.not_found}.` +
    (r.google_used ? "" : " Add a Google Places key in Settings to find more.") + (r.errors ? ` ${r.errors} lookups failed; they'll be tried again.` : "") + (r.cancelled ? " (cancelled)" : ""),
};
async function startJob(name, path, body, btn) {
  await act(() => api(path, body), r => r.paused || (!r.started && !r.result) ? r.message
    : r.result ? JOB_DONE[name](r.result) : "Started. Progress shows at the top of the page.", btn);
}
const updateCases = btn => startJob("cases", "/api/cases/update", { force: true }, btn);
const findContacts = btn => startJob("contacts", "/api/find-contacts", {}, btn);
function activeLeads() {
  return S.leads.filter(l => l.status !== "stale" && l.status !== "skip");
}
function untouched(l) { return !l.touches.length; }
const SOURCE_LABEL = { manual: "entered by hand", import: "imported file", osm: "OpenStreetMap", google: "Google Places",
  "osm+website": "OpenStreetMap + company website", "google+website": "Google Places + company website", website: "company website" };
function phoneCell(l) {
  return l.owner_phone ? `<a href="tel:${esc(l.owner_phone.replace(/\D/g, ""))}">${esc(l.owner_phone)}</a>` : '<span class="muted">–</span>';
}
function emailCell(l) {
  return l.owner_email ? `<a href="mailto:${esc(l.owner_email)}">${esc(l.owner_email)}</a>` : '<span class="muted">–</span>';
}
async function importContacts(file) {
  await act(async () => send(`/api/import?source=contacts&filename=${encodeURIComponent(file.name)}`, { method: "POST", body: await file.arrayBuffer() }),
    r => `Phones and emails: ${r.matched} of ${r.rows} rows matched a lead, ${r.updated} leads filled in.`
    + (r.skipped_manual ? ` ${r.skipped_manual} row${r.skipped_manual > 1 ? "s" : ""} skipped because the lead has a number entered by hand.` : "")
    + (r.kept_existing ? ` ${r.kept_existing} lead${r.kept_existing > 1 ? "s" : ""} kept the different number they already had.` : "")
    + (r.rows && !r.matched ? " No rows matched: the file needs a lead_id, parcel, property address or owner name column." : ""));
}

// ---------- header ----------------------------------------------------------
const JOB_BUTTON = { cases: "#cUpdate", contacts: "#lFind" };
const runningJobs = () => Object.values(S.jobs || {}).filter(j => j.running);
function jobLine(j) {
  const n = j.total ? `${j.done} of ${j.total}` : "starting";
  return `<span class="job">${esc(j.label)}: ${n}${j.total ? ` <progress max="${j.total}" value="${j.done}"></progress>` : ""}
    ${j.cancelling ? "stopping…" : `<button class="btn small" data-cancel="${esc(j.name)}">Cancel</button>`}</span>`;
}
function renderHeader() {
  const open = activeLeads();
  const assigned = open.filter(l => l.channel).length;
  const pending = S.leads.filter(l => !l.enriched_at).length;
  const d = S.daily || {};
  const unchecked = (S.view_counts || {}).unchecked || 0;
  const msg = d.message || "starting the daily check";
  const daily = d.running ? `${msg[0].toUpperCase() + msg.slice(1)}…`

function filteredLeads() {

    if (ui.type === "eviction" && l.lead_type !== "eviction") return false;
    if (ui.type === "code_violation" && l.lead_type !== "code_violation") return false;
    if (ui.type === "absentee" && !l.owner_absentee) return false;
    if (ui.type === "entity" && !l.owner_entity) return false;
    if (ui.type === "has_phone" && !l.owner_phone) return false;
    if (ui.type === "no_phone" && l.owner_phone) return false;

    if (q && ![l.address, l.owner_name, l.plaintiff, l.defendant, l.source_id, l.description, l.parcel, l.notes, l.owner_phone, l.owner_email, l.contact_name].join(" ").toLowerCase().includes(q)) return false;

function routeOrder(q) {
  // Nearest-neighbour walk starting from Steve's base.
  const left = q.filter(l => l.lat != null), out = [];
  let cur = { lat: S.settings.base_lat, lon: S.settings.base_lon };
  if (cur.lat == null && left.length) cur = left[0];
  const d = (a, b) => Math.hypot(a.lat - b.lat, (a.lon - b.lon) * Math.cos(a.lat * Math.PI / 180));
  while (left.length) {
    let bi = 0; left.forEach((l, i) => { if (d(cur, l) < d(cur, left[bi])) bi = i; });
    cur = left.splice(bi, 1)[0]; out.push(cur);
  }
  return out.concat(q.filter(l => l.lat == null));
}
function renderRoute(el, q) {

  el.innerHTML = `<div class="card">

      <div class="tablewrap"><table><thead><tr><th>Method</th><th>Cost per contact $</th><th>Tracking number</th></tr></thead><tbody>
      ${Object.entries(S.channels).map(([c, n]) => `<tr><td>${chDot(c)}</td><td><input type="number" step="0.01" min="0" data-cost="${c}" value="${st.costs[c] ?? 0}" style="width:90px" aria-label="Cost per contact for ${esc(n)}"></td>
        <td><input data-track="${c}" value="${esc(st.tracking_numbers[c] || "")}" placeholder="uses main phone" aria-label="Tracking number for ${esc(n)}"></td></tr>`).join("")}</tbody></table></div></div>
    <div class="card"><h2>Messages</h2><p class="hint">Fields: {owner}, {owner_first}, {address}, {at_address} (“ at 123 Main St”, or nothing when the address isn't known), {phone}, {business}.</p>
      ${Object.keys(st.templates).map(c => `<h3><label for="tpl-${c}">${esc(TEMPLATE_LABEL[c] || c)}</label></h3><textarea id="tpl-${c}" data-tpl="${c}">${esc(st.templates[c] || "")}</textarea>`).join("")}
    </div>
    <div class="card"><h2>Appearance</h2>
      <label>Theme <select id="sTheme">${[["system", "Same as this computer"], ["light", "Light"], ["dark", "Dark"]].map(([v, t]) => `<option value="${v}" ${theme() === v ? "selected" : ""}>${t}</option>`).join("")}</select></label>
      <span class="hint">Saved in this browser.</span>
    </div>
    <button class="btn primary" id="sSave">Save settings</button>`;
  $("#sTheme").onchange = e => setTheme(e.target.value);
  for (const id of ["sGoogleLimit", "sGoogleDaily"]) $("#" + id + "None").onchange = e => { $("#" + id).disabled = e.target.checked; };
  $("#sPaused").onchange = e => act(() => api("/api/settings", { paused: e.target.checked }),
    e.target.checked ? "Paused: nothing will be checked or looked up until you turn this off." : "Lead Desk is running again.", e.target);
  const gc = $("#sGoogleClear");
  if (gc) gc.onclick = e => { if (confirm("Remove the saved Google key? Phone lookups will then use only OpenStreetMap and company websites until you add a key again.")) act(() => api("/api/settings", { clear_google_key: true }), "Google key removed", e.currentTarget); };
  const lim = id => $("#" + id + "None").checked ? null : ($("#" + id).value === "" ? 0 : Number($("#" + id).value));
  $("#sSave").onclick = e => {
    const costs = {}, tracking = {}, templates = {};
    document.querySelectorAll("[data-cost]").forEach(i => costs[i.dataset.cost] = Number(i.value || 0));
    document.querySelectorAll("[data-track]").forEach(i => tracking[i.dataset.track] = i.value.trim());
    document.querySelectorAll("[data-tpl]").forEach(i => templates[i.dataset.tpl] = i.value);
    act(() => api("/api/settings", { business_name: $("#sName").value.trim(), business_phone: $("#sPhone").value.trim(), base_address: $("#sBase").value.trim(), google_places_api_key: $("#sGoogle").value.trim(), google_enabled: $("#sGoogleOn").checked, google_monthly_limit: lim("sGoogleLimit"), google_daily_limit: lim("sGoogleDaily"), costs, tracking_numbers: tracking, templates }), "Settings saved", e.currentTarget);
  };
}

// ---------- wiring ----------------------------------------------------------
function render() {
  renderHeader();
  if (ui.tab === "leads") renderLeads();
  if (ui.tab === "outreach") renderOutreach();
  if (ui.tab === "results") renderResults();
  if (ui.tab === "settings") renderSettings();
  if (ui.open != null) renderDrawer(); else $("#drawer").classList.remove("open");
}
// The tab, filters and open lead live in the address (#tab=leads&type=has_phone&lead=12),
// so a reload or Back shows the same view and a link can be shared.
const URL_KEYS = { tab: "tab", q: "q", type: "type", status: "status", channel: "channel", sort: "sort", outreachTab: "method", open: "lead" };
const UI_DEFAULTS = { ...ui };
function syncUrl(push) {
  const p = new URLSearchParams();
  for (const [k, name] of Object.entries(URL_KEYS)) if (ui[k] != null && ui[k] !== UI_DEFAULTS[k]) p.set(name, ui[k]);
  const hash = p.toString() ? "#" + p.toString() : location.pathname + location.search;
  if (("#" + p.toString()) === location.hash || (!p.toString() && !location.hash)) return;
  history[push ? "pushState" : "replaceState"](null, "", hash);
}
function readUrl() {
  const p = new URLSearchParams(location.hash.slice(1));
  for (const [k, name] of Object.entries(URL_KEYS)) ui[k] = p.has(name) ? p.get(name) : UI_DEFAULTS[k];
  ui.open = ui.open != null && ui.open !== "" ? +ui.open : null;
}
window.addEventListener("popstate", () => { readUrl(); if (S) render(); });
document.querySelectorAll("#nav button").forEach(b => b.onclick = () => { ui.tab = b.dataset.tab; syncUrl(true); render(); });
$("#refreshBtn").onclick = e => act(() => api("/api/refresh", {}), r => r.message || "Checking the court calendar. This page updates as cases come in.", e.currentTarget);
// While the daily check or a job runs, reload every few seconds so new cases
// and progress appear. Drawer typing is kept (see drafts), and the page isn't
// redrawn under someone typing in a box.
function watch() {
  if (watch.t) return;
  const before = new Set(runningJobs().map(j => j.name));
  watch.t = setInterval(async () => {
    try {
      const wasDaily = S.daily.running;
      S = await api("/api/state");
      for (const name of [...before]) {
        const j = (S.jobs || {})[name];
        if (j && !j.running) { before.delete(name); toast(j.error || JOB_DONE[name](j.result || {}), 9000); }
      }
      runningJobs().forEach(j => before.add(j.name));
      if (wasDaily && !S.daily.running) toast("Done: " + (S.daily.summary || S.daily.message || ""), 8000);
      if (!S.daily.running && !runningJobs().length) { clearInterval(watch.t); watch.t = null; }
      const typing = document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
      if (typing) renderHeader(); else render();
    } catch (e) { /* keep trying */ }
  }, 3000);
}
$("#importFile").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  const source = /\.csv$/i.test(f.name) ? "csv_import" : "pima_jp_calendar";
  await act(async () => send(`/api/import?source=${source}&filename=${encodeURIComponent(f.name)}`, { method: "POST", body: await f.arrayBuffer() }),
    r => `Imported ${r.imported} lead${r.imported === 1 ? "" : "s"}: ${r.new} new, ${r.updated} already listed.`
      + (r.with_notice != null ? (r.with_notice ? " An eviction notice is filed." : " No eviction notice in this case yet.") : "")
      + (r.waiting_for_case_check ? ` ${r.waiting_for_case_check} are marked “case not checked” until their court page is read (next check ${S.daily.next_run || "tomorrow 6:00 AM"}).` : "")
      + (r.unreadable_dates ? ` ${r.unreadable_dates} date${r.unreadable_dates === 1 ? "" : "s"} couldn't be read and were left empty.` : "")
      + " They're on the Leads tab.");
  e.target.value = "";
  if (ui.tab !== "leads") { ui.tab = "leads"; syncUrl(true); render(); }
};
bindLabels(document.querySelector("header"));
document.addEventListener("keydown", e => { if (e.key === "Escape" && ui.open != null) closeDrawer(); });
window.addEventListener("beforeunload", e => { if (Object.keys(drafts).length) { e.preventDefault(); e.returnValue = ""; } });
function start() {
  readUrl();
  $("#sub").textContent = "Loading…";
  load().catch(e => {
    $("#sub").innerHTML = `Couldn't load the leads. ${esc(e.message)} <button class="btn small" id="retry">Retry</button>`;
    $("#retry").onclick = start;
  });
}
start();
</script>
</body>
