name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lead
          POSTGRES_PASSWORD: lead
          POSTGRES_DB: leads
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Browser for the Lead Desk page tests
        run: python -m playwright install --with-deps chromium
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Type check
        run: mypy
      # Line coverage is reported, and the run fails below the floor in pyproject.toml.
      # A missing Playwright browser fails the browser tests here (CI is set), not skips them.
      - run: pytest -q --cov --cov-report=term
      - name: Same tests on Postgres (Lead Desk online uses Neon)
        run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql://lead:lead@localhost:5432/leads

  # Hits the live City of Tucson and county parcel APIs so a change in its fields shows up here.
  # Prints counts only; no lead data is uploaded (this repository is public).
  live-tucson:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - run: leadgen --db /tmp/leads.db fetch --source tucson_code_cases --days 30
      - run: leadgen --db /tmp/leads.db enrich --limit 50
      - run: leadgen --db /tmp/leads.db list --limit 0
      - name: Daily eviction check on live data (counts only, no names)
        run: |
          python - <<'PY'
          from leadgen import daily
          from leadgen.web import App
          a = App("/tmp/live2.db")
          a.save_settings({"lead_view": "all"})
          s = a.refresh({"case_limit": 15, "contact_limit": 10})
          print(daily.describe(s))
          print({k: v for k, v in s.items() if k not in ("started_at", "finished_at")})
          c = a.conn()
          q = lambda sql: c.execute(sql).fetchone()[0]
          ev = "FROM leads WHERE lead_type = 'eviction'"
          print("evictions", q(f"SELECT COUNT(*) {ev}"),
                "| case read", q(f"SELECT COUNT(*) {ev} AND case_checked_at IS NOT NULL"),
                "| notice", q(f"SELECT COUNT(*) {ev} AND eviction_notice = 1"),
                "| with case link", q(f"SELECT COUNT(*) {ev} AND url LIKE '%jcDisplayCase%'"),
                "| landlord owner found", q(f"SELECT COUNT(*) {ev} AND owner_name IS NOT NULL"),
                "| property found", q(f"SELECT COUNT(*) {ev} AND address IS NOT NULL"),
                "| phone", q(f"SELECT COUNT(*) {ev} AND owner_phone IS NOT NULL"))
          print("lat/lon types", [tuple(r) for r in c.execute("SELECT typeof(lat), typeof(lon), COUNT(*) FROM leads GROUP BY 1, 2")])
          print(len(a.state()["leads"]), "leads in state")
          assert s["evictions"].get("new", 0) > 0, "calendar search found no evictions"
          assert s["evictions"]["new"] < 50 or s["evictions"]["pages"] > 1, "calendar stopped after the first results page"
          PY
      - name: Lead Desk state on live data (counts only)
        run: >
          python -c "from leadgen.web import App; a=App('/tmp/leads.db'); a.save_settings({'lead_view': 'all'}); L=a.state()['leads'];
          print(len(L), 'leads;', sum(1 for l in L if l['owner_name']), 'with owner;',
          sum(1 for l in L if l['owner_absentee']), 'absentee;',
          sum(1 for l in L if l['owner_entity']), 'company/trust;',
          sum(1 for l in L if l['score'] >= 60), 'scored 60+')"
      - name: Justice Court case page on live data (fields found, no names)
        continue-on-error: true
        run: |
          leadgen --db /tmp/cases.db cases add "https://www.jp.pima.gov/CaseSearch/jcDisplayCase.aspx?ID=1520702"
          python - <<'PY'
          from leadgen import db
          r = db.connect("/tmp/cases.db").execute("SELECT * FROM leads").fetchone()
          shown = ("lead_type", "eviction_notice", "case_status", "event_date", "next_court_date")
          print({k: (r[k] if k in shown else bool(r[k])) for k in (*shown, "source_id", "plaintiff", "defendant")})
          PY
      - name: Business phone lookup on live data (counts only)
        continue-on-error: true
        run: leadgen --db /tmp/live2.db contacts find --limit 15
