# The daily eviction check for Lead Desk online (docs/VERCEL.md): every
# morning at 6:00 in Tucson (13:00 UTC; Arizona has no daylight saving time),
# and when someone presses "Check for new evictions" online.
#
# It also starts at 7, 8, 10 and 12 in Tucson. Those runs (--if-due) do
# nothing unless the morning's check failed outright (the court or City site
# down) and its same-day retry is due; then they run it again.
#
# It writes to the Neon (Postgres) database Lead Desk reads. This repository is public,
# so the log shows step names and counts only (--counts-only), and nothing
# is uploaded.
name: Daily eviction check

on:
  schedule:
    - cron: "0 13 * * *"
    - cron: "0 14,15,17,19 * * *"
  workflow_dispatch:

concurrency:
  group: daily-eviction-check
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
      # Kill switch: set the repository variable LEADDESK_PAUSED to 1 to stop
      # the check (Lead Desk's Settings "Pause" works too). See docs/VERCEL.md.
      LEADDESK_PAUSED: ${{ vars.LEADDESK_PAUSED }}
    steps:
      - name: Check the database is set up
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::Add DATABASE_URL as a repository secret (docs/VERCEL.md). Skipping."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@v4
        if: env.SKIP != '1'
      - uses: actions/setup-python@v5
        if: env.SKIP != '1'
        with:
          python-version: "3.12"
      - if: env.SKIP != '1'
        run: pip install .
      - if: env.SKIP != '1'
        # Scheduled runs only run when due; the button always runs.
        run: leadgen daily --counts-only ${{ github.event_name == 'schedule' && '--if-due' || '' }}
